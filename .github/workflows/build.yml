
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/*.apk teacher-bag.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teacher-bag-debug-apk
          path: teacher-bag.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="teacher-bag-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" teacher-bag.apk \
            --title "TeacherBag APK ${GITHUB_RUN_NUMBER}" \
            --notes "نسخة تطبيق حقيبة المعلم الشاملة"
